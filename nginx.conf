# Reson8 Web Client — nginx config for the Docker deployment option.
# See DEPLOYMENT.md for the full reasoning behind the CSP directives below,
# especially the connect-src/img-src tradeoff (this app connects to a
# user-supplied reson8 server origin at runtime, entered on the connect
# screen — there is no single hostname to allowlist).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The CSP string is defined once via `set` (which inherits into
    # locations normally) and referenced as $csp below — but the
    # `add_header` calls themselves are repeated in every location block,
    # not inherited: nginx only inherits `add_header`s from the parent
    # level when the child location defines *no* `add_header` of its own,
    # so a location that sets its own Cache-Control (every one below does)
    # would silently drop these security headers entirely if they were
    # only declared once at the server level.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https: wss:; media-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # `connect-src`/`img-src` intentionally scope to *any* host over a
    # secure scheme (`https:`/`wss:`) rather than a single origin — this
    # app has no backend of its own and connects to whatever reson8 server
    # the user types into the connect screen, so a single hardcoded origin
    # would break the app's actual, intended purpose. Deliberate tradeoff,
    # not an oversight — see DEPLOYMENT.md for the full writeup master PRD
    # §5.6 asks this phase to produce.
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback — every non-file path resolves to index.html so React
    # Router's client-side routes (e.g. /app/channels/:id) work on a hard
    # reload or direct link, not just client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed, content-addressed build output (dist/assets/*.js|css) — safe
    # to cache aggressively forever, since a new deploy produces new
    # filenames rather than overwriting these. Repeats the security headers
    # above explicitly: an `add_header` in a location block replaces, not
    # extends, whatever the server block set (nginx's well-known
    # inheritance gotcha) — every location below does this for the same
    # reason.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The service worker itself must NEVER be cached — browsers already
    # re-check it periodically, but a proxy/CDN-level cache-control here
    # can silently keep serving a stale sw.js indefinitely, defeating the
    # whole P7.2 update-flow this app already built (see
    # src/services/swUpdateService.ts). Same reasoning for the manifest.
    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html itself must also stay revalidate-on-every-load — it's what
    # references the current hashed asset filenames and registers the
    # current service worker; caching it would pin users to an old build.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
